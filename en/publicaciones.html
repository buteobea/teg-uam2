<main>
<section class="phead"><div class="art" aria-hidden="true"></div><div class="wrap">
  <nav class="crumb mono" aria-label="Breadcrumb"><a href="index.html">TEG-UAM</a><span>/</span><span>Publications</span></nav>
  <h1>Publications</h1>
  <p class="lede">Papers, books and outreach by the group, and how output has changed over the years. Search by author, title or journal and copy a citation in one click.</p>
  <div class="kpis" id="kp"></div>
</div></section>
<section class="band"><div class="wrap">
  <div class="sec-head rv"><h2>Output per year</h2><p class="mute" id="chartnote"></p></div>
  <div class="chartfig rv" id="chart"><svg role="img" aria-label="Papers published per year"></svg></div>
  <div class="legend"><span><i style="background:var(--leaf)"></i>Papers</span><span><i style="background:var(--olive)"></i>In Q1 journals</span><span><i style="border:1.5px dashed var(--mute)"></i>Year without data</span></div>

</div></section>
<section class="band tint"><div class="wrap">
  <div class="tools"><input class="search" id="bq" type="search" placeholder="Author, title, journal…" aria-label="Search publications"><select class="sel" id="by" aria-label="Year"></select><select class="sel" id="bt" aria-label="Type"><option value="">All</option><option value="art">Papers</option><option value="cap">Books and chapters</option><option value="div">Outreach</option><option value="nota">Editorials, letters and notes</option><option value="prensa">Press</option></select><select class="sel" id="bs" aria-label="Sort"><option value="">Newest first</option><option value="c">Most cited</option></select><label style="display:flex;gap:8px;align-items:center;min-height:46px"><input type="checkbox" id="boa"> Open access only</label></div>

  <div id="pubs"></div>
  <div style="margin-top:18px"><button class="btn ghost" id="bmore" style="color:var(--text)">Show more</button></div>
</div></section>
