<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicaciones · TEG-UAM</title>
<meta name="description" content="Publicaciones científicas del TEG-UAM.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="publicaciones">
<main>
<section class="phead"><div class="art" aria-hidden="true"></div><div class="wrap">
  <nav class="crumb mono" aria-label="Ruta"><a href="index.html">TEG-UAM</a><span>/</span><span>Publicaciones</span></nav>
  <h1>Publicaciones</h1>
  <p class="lede">Artículos, libros y divulgación del grupo, con su evolución a lo largo de los años. Busca por autor, título o revista y copia la cita con un clic.</p>
  <div class="kpis" id="kp"></div>
</div></section>
<section class="band"><div class="wrap">
  <div class="sec-head rv"><h2>Evolución anual</h2><p class="mute" id="chartnote"></p></div>
  <div class="chartfig rv" id="chart"><svg role="img" aria-label="Artículos publicados por año"></svg></div>
  <div class="legend"><span><i style="background:var(--leaf)"></i>Artículos</span><span><i style="background:var(--olive)"></i>En revistas Q1</span><span><i style="border:1.5px dashed var(--mute)"></i>Año sin datos</span></div>
</div></section>
<section class="band tint"><div class="wrap">
  <div class="tools"><input class="search" id="bq" type="search" placeholder="Autor, título, revista…" aria-label="Buscar publicaciones"><select class="sel" id="by" aria-label="Año"></select><select class="sel" id="bt" aria-label="Tipo"><option value="">Todo</option><option value="art">Artículos</option><option value="cap">Libros y capítulos</option><option value="div">Divulgación</option><option value="nota">Editoriales, cartas y notas</option><option value="prensa">Prensa</option></select><label style="display:flex;gap:8px;align-items:center;min-height:46px"><input type="checkbox" id="boa"> Solo acceso abierto</label></div>
  <p class="count" id="bcount"></p>
  <div id="pubs"></div>
  <div style="margin-top:18px"><button class="btn ghost" id="bmore" style="color:var(--text)">Mostrar más</button></div>
</div></section>
</main>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
